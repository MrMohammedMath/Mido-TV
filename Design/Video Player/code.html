<script>
    // Simple 3-second auto-hide logic for UI elements to simulate 10-foot experience
    let timeoutId;
    const uiElements = document.querySelectorAll('.ui-element');
    const container = document.getElementById('player-container');

    function resetTimer() {
      uiElements.forEach(el => el.classList.remove('opacity-0'));
      container.classList.remove('cursor-none');
      
      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        uiElements.forEach(el => el.classList.add('opacity-0'));
        container.classList.add('cursor-none');
      }, 3000);
    }

    container.addEventListener('mousemove', resetTimer);
    container.addEventListener('keydown', resetTimer);
    container.addEventListener('click', resetTimer);
    
    // Initial call to start the timer
    resetTimer();
  </script>
