<script>
    // Simple script to handle keyboard navigation for "10-foot UI" feel
    document.addEventListener('DOMContentLoaded', () => {
        const cards = document.querySelectorAll('button');
        let currentIndex = 0;

        // Auto-focus first card on load if nothing else is focused
        if (cards.length > 0) {
            cards[0].focus();
        }

        document.addEventListener('keydown', (e) => {
            const rowSize = 3;
            let newIndex = currentIndex;

            switch(e.key) {
                case 'ArrowRight':
                    if ((currentIndex + 1) % rowSize !== 0 && currentIndex + 1 < cards.length) newIndex++;
                    break;
                case 'ArrowLeft':
                    if (currentIndex % rowSize !== 0) newIndex--;
                    break;
                case 'ArrowDown':
                    if (currentIndex + rowSize < cards.length) newIndex += rowSize;
                    break;
                case 'ArrowUp':
                    if (currentIndex - rowSize >= 0) newIndex -= rowSize;
                    break;
                // Add number key support matching the badges
                case '1': case '2': case '3': case '4': case '5': case '6': case '7': case '8': case '9':
                    const numIndex = parseInt(e.key) - 1;
                    if(numIndex >= 0 && numIndex < cards.length) newIndex = numIndex;
                    break;
            }

            if (newIndex !== currentIndex) {
                e.preventDefault(); // Prevent scrolling
                currentIndex = newIndex;
                cards[currentIndex].focus();
            }
        });
        
        // Update currentIndex if focused via mouse or tab
        cards.forEach((card, index) => {
            card.addEventListener('focus', () => {
                currentIndex = index;
            });
        });
    });
